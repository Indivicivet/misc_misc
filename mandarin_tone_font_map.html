<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mandarin Tone Typography</title>
  <!-- Google Fonts for Chinese typefaces -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Noto+Sans+SC:wght@100;300&family=Noto+Serif+SC:wght@300;400&family=ZCOOL+XiaoWei&display=swap"
    rel="stylesheet"
  />
  <!-- pinyin-pro library for tone extraction -->
  <script src="https://unpkg.com/pinyin-pro"></script>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d26;
      --text-color: #e5e7eb;
      --border-color: #2b3040;
      --accent-color: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      font-size: 1.25rem;
      line-height: 1.8;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }

    #output {
      min-height: 220px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      font-size: 2.2rem;
      line-height: 2.3;
      white-space: pre-wrap;
      word-break: break-word;
      letter-spacing: 0.05em;
    }

    /* Tone 1: light, thin, delicate - subtle blue tint */
    .tone-1 {
      font-family: "Noto Sans SC", sans-serif;
      font-weight: 100;
      color: #b5d5f2;
      opacity: 0.95;
    }

    /* Tone 2: curvy, smooth, elegant - subtle green tint */
    .tone-2 {
      font-family: "ZCOOL XiaoWei", serif;
      font-weight: 400;
      color: #b8e8c8;
    }

    /* Tone 3: grungy, thick, ugly - subtle orange tint */
    .tone-3 {
      font-family: "Long Cang", cursive;
      font-size: 1.1em;
      font-weight: 700;
      color: #f3d4b2;
    }

    /* Tone 4: sharp, cutting - subtle red tint */
    .tone-4 {
      font-family: "Noto Serif SC", serif;
      font-weight: 300;
      letter-spacing: 0.02em;
      color: #f2b8ba;
    }

    /* Neutral tone / non-Chinese characters - subtle muted grey */
    .tone-0 {
      font-family: "Noto Sans SC", sans-serif;
      font-weight: 300;
      color: #9ca3af;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <textarea id="input" placeholder="输入或粘贴中文（简体或繁体）..."></textarea>
    <div id="output"></div>
  </div>

  <script>
    const input = document.getElementById("input");
    const output = document.getElementById("output");

    function renderText() {
      const text = input.value;
      if (!text) {
        output.innerHTML = "";
        return;
      }

      if (typeof pinyinPro === "undefined" || !pinyinPro.pinyin) {
        output.textContent = text;
        return;
      }

      const tones = pinyinPro.pinyin(text, {
        toneType: "num",
        type: "array"
      });

      const fragment = document.createDocumentFragment();
      const chars = Array.from(text);

      chars.forEach((char, idx) => {
        const toneVal = tones[idx] || "";
        const match = toneVal.match(/[1-4]/);
        const toneNum = match ? match[0] : "0";

        if (char === "\n") {
          fragment.appendChild(document.createElement("br"));
        } else {
          const span = document.createElement("span");
          span.textContent = char;
          span.className = "tone-" + toneNum;
          fragment.appendChild(span);
        }
      });

      output.innerHTML = "";
      output.appendChild(fragment);
    }

    input.addEventListener("input", renderText);

    input.value = "妈麻马骂 谁说女子不如男 天地玄黄 宇宙洪荒";
    renderText();
  </script>
</body>
</html>
